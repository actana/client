# T-220 — publish @actana/sdk and @actana/cli independently via Changesets.
#
# Only packages whose version changed in the Version Packages PR are published.
# npm provenance is enabled (publishConfig.provenance + id-token: write).
#
# Publish rights: store NPM_TOKEN on actana/client only — an npm automation token
# with Read and Write on @actana/*, trusted to this GitHub repository. Control's
# publish token must stay revoked before shipping from here (see docs/ops-publish-freeze.md).

name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

env:
  NODE_VERSION: "24.19.0"
  PNPM_VERSION: "11.1.2"

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          cache: true

      - run: pnpm install --frozen-lockfile

      - name: Build publishable packages
        run: pnpm -r --if-present --filter "@actana/sdk" --filter "@actana/cli" run build

      - name: Create release PR or publish to npm
        uses: changesets/action@06245a4e0a36c064a573d4150030f5ec548e4fcc # v1.4.10
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
