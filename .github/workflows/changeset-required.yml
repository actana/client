# T-220 — require a changeset when a PR touches a publishable package.
# Kept separate from ci.yml so T-223's drift workflow can evolve independently.

name: Changeset Required

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

env:
  NODE_VERSION: "24.19.0"
  PNPM_VERSION: "11.1.2"

jobs:
  verify:
    name: Changeset
    # The Version Packages PR is the one PR that carries no changeset by design: the Changesets
    # versioning commit on `changeset-release/main` (the branch changesets/action pushes) consumes
    # them into package versions and `.changeset/pre.json`, so `changeset status` always finds none.
    # Skip it for that one branch, and only when it is a branch of this repository, so a fork
    # cannot dodge the check by naming its branch the same. Every other branch is still checked.
    if: >-
      github.event.pull_request.draft == false &&
      !(github.head_ref == 'changeset-release/main' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          cache: true

      - run: pnpm install --frozen-lockfile

      - name: Detect package changes
        id: packages
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- packages/ | grep -q .; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require changeset
        if: steps.packages.outputs.touched == 'true'
        run: pnpm changeset status --since="origin/${{ github.base_ref }}"
