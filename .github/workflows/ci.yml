name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - "beta/**"
  workflow_dispatch:

concurrency:
  group: ${{ startsWith(github.ref, 'refs/heads/beta/') && format('ci-train-{0}', github.ref) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/beta/') }}

permissions:
  contents: read

env:
  NODE_VERSION: "24.19.0"
  PNPM_VERSION: "11.1.2"

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          cache: true
      - run: pnpm install --frozen-lockfile
      # The SDK's pretest (packages/sdk/scripts/vendor-control-pin.mjs) extracts a
      # pinned actana/control commit from a sibling `../actana-control` checkout.
      - name: Check out actana/control beside this repo
        run: git clone --quiet --filter=blob:none https://github.com/actana/control.git "$GITHUB_WORKSPACE/../actana-control"
      - run: pnpm test

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  shared-key-seaweedfs:
    name: Shared-key isolation (SeaweedFS)
    runs-on: ubuntu-24.04
    env:
      # Same image and digest as actana/control deploy/docker-compose.yml (control PR 586).
      SEAWEEDFS_IMAGE: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
      SEAWEEDFS_ENDPOINT: http://127.0.0.1:8333
      SEAWEEDFS_JWKS_PORT: "18999"
      SEAWEEDFS_OIDC_ISSUER: http://127.0.0.1:18999
      SEAWEEDFS_OIDC_AUDIENCE: actana-shared
      SEAWEEDFS_BUCKET: actana-shared
      SEAWEEDFS_PREFIX: cores
      SEAWEEDFS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          cache: true
      - run: pnpm install --frozen-lockfile
      # A `services:` container cannot take a command or the checked-out IAM config, and SeaweedFS
      # needs both (`server -s3 -s3.iam.config=...`), so the same pinned image is started here.
      - name: Start SeaweedFS (S3 gateway, STS and the per-Core role)
        run: |
          set -euo pipefail
          cfg="$RUNNER_TEMP/seaweedfs"
          mkdir -p "$cfg"
          sts_key="$(openssl rand -base64 32)"
          admin_key="admin$(openssl rand -hex 8)"
          admin_secret="$(openssl rand -hex 24)"
          echo "::add-mask::$sts_key"
          echo "::add-mask::$admin_secret"
          sed \
            -e "s|@@STS_SIGNING_KEY@@|$sts_key|g" \
            -e "s|@@OIDC_ISSUER@@|$SEAWEEDFS_OIDC_ISSUER|g" \
            -e "s|@@OIDC_JWKS_URL@@|$SEAWEEDFS_OIDC_ISSUER/jwks.json|g" \
            -e "s|@@OIDC_AUDIENCE@@|$SEAWEEDFS_OIDC_AUDIENCE|g" \
            -e "s|@@BUCKET@@|$SEAWEEDFS_BUCKET|g" \
            -e "s|@@PREFIX@@|$SEAWEEDFS_PREFIX|g" \
            packages/sdk/src/shared-key/__tests__/seaweedfs/iam.json.tmpl >"$cfg/iam.json"
          chmod 644 "$cfg/iam.json"
          echo "SEAWEEDFS_ADMIN_ACCESS_KEY=$admin_key" >>"$GITHUB_ENV"
          echo "SEAWEEDFS_ADMIN_SECRET_KEY=$admin_secret" >>"$GITHUB_ENV"
          docker run -d --name seaweedfs --network host \
            -e AWS_ACCESS_KEY_ID="$admin_key" -e AWS_SECRET_ACCESS_KEY="$admin_secret" \
            -v "$cfg:/cfg:ro" "$SEAWEEDFS_IMAGE" \
            server -dir=/data -ip=127.0.0.1 -ip.bind=127.0.0.1 -filer -s3 -s3.port=8333 -s3.ip.bind=127.0.0.1 \
            -s3.port.iceberg=0 -s3.port.lance=0 -s3.iam.config=/cfg/iam.json -s3.iam.readOnly=true
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9333/cluster/healthz >/dev/null 2>&1 && \
               [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8333/)" != "000" ]; then
              echo "SeaweedFS is up"; exit 0
            fi
            sleep 2
          done
          docker logs seaweedfs || true
          echo "SeaweedFS did not come up" >&2
          exit 1
      # SeaweedFS may keep the JWKS it first read, so both test files below sign with this one key.
      - name: Make the controller's signing key
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/controller-signing.pem"
          echo "SEAWEEDFS_SIGNING_KEY_FILE=$RUNNER_TEMP/controller-signing.pem" >>"$GITHUB_ENV"
      - name: Run the isolation test
        working-directory: packages/sdk
        run: pnpm exec vitest run src/shared-key/__tests__/seaweedfs.isolation.test.ts --reporter=verbose
      # CoreShared (S3 mode) on the same SeaweedFS: the mode-agnostic contract suite, one Core id per test.
      - name: Run the CoreShared contract suite
        working-directory: packages/sdk
        run: pnpm exec vitest run src/shared/__tests__/s3.contract.test.ts --reporter=verbose
      - name: SeaweedFS log
        if: failure()
        run: docker logs seaweedfs || true
